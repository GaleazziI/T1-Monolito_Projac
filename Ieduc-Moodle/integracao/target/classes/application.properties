spring.application.name=integracao
server.port=8080

# --- iEducar (origem) ---
integracao.ieducar.base-url=${IEDUCAR_URL:http://localhost:8080}
integracao.ieducar.token=${IEDUCAR_API_TOKEN:ieducar-integracao-token-trocar-em-producao-0000}
integracao.ieducar.access-key=${IEDUCAR_API_ACCESS_KEY:ieducar-access-key}
integracao.ieducar.secret-key=${IEDUCAR_API_SECRET_KEY:ieducar-secret-key}
integracao.ieducar.instituicao-id=${IEDUCAR_INSTITUICAO_ID:1}
integracao.ieducar.timeout=PT30S

# --- Moodle (destino) ---
integracao.moodle.base-url=${MOODLE_URL:http://localhost:8081}
integracao.moodle.token=${MOODLE_WS_TOKEN:a1b2c3d4e5f60718293a4b5c6d7e8f90}
integracao.moodle.papel-aluno-id=${MOODLE_PAPEL_ALUNO_ID:5}
integracao.moodle.papel-professor-id=${MOODLE_PAPEL_PROFESSOR_ID:3}
integracao.moodle.senha-inicial=${MOODLE_SENHA_INICIAL:Mudar@2026!}
integracao.moodle.dominio-email=${MOODLE_DOMINIO_EMAIL:exemplo.edu.br}
integracao.moodle.timeout=PT30S

# --- Sincronização agendada ---
integracao.sincronizacao.agendada=${SINCRONIZACAO_AGENDADA:true}
integracao.sincronizacao.atraso-inicial=${SINCRONIZACAO_ATRASO_INICIAL:PT30S}
integracao.sincronizacao.intervalo=${SINCRONIZACAO_INTERVALO:PT2M}

management.endpoints.web.exposure.include=health
