user nginx;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    client_body_buffer_size 64k;
    client_max_body_size 100m;
    client_body_in_single_buffer on;
    client_header_buffer_size 1m;
    large_client_header_buffers 4 8k;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream php-fpm {
        server 127.0.0.1:9000;
    }

    server {
        listen 80 default_server;
        root /var/www/ieducar/public;
        index index.php index.html;

        # Arquivos estáticos do iEducar legado (CSS, JS, imagens, fontes)
        location ~ ^/intranet/(styles|scripts|imagens|fonts|static)/ {
            root /var/www/ieducar/ieducar;
            try_files $uri =404;
            expires 1h;
        }

        include /etc/nginx/snippets/snippets.conf;
    }
}
